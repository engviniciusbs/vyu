[package]
name = "vyu"
version = "0.1.0"
edition = "2024"
description = "Visualizador desktop leve para câmeras Tapo/RTSP no Windows"
license = "MIT"
repository = "https://github.com/engviniciusbs/vyu"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
ffmpeg-next = "9"
cpal = "0.18"
ringbuf = "0.6"
keyring = "4"
winreg = "0.56"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
percent-encoding = "2"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
